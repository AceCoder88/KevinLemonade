name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk KevinLemonade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KevinLemonade-apk
          path: KevinLemonade.apk

      # Keep a single "latest" release whose APK is always the newest build,
      # so there's one stable link to download from a phone.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KevinLemonade.apk \
            --title "Latest build" \
            --notes "Debug build of ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
